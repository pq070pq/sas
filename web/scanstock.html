<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<title>الإفصاحات | SAS PRO</title>
<script src="https://telegram.org/js/telegram-web-app.js?63"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#071019;color:#eaf2f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
header{height:54px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#0b1722;border-bottom:1px solid #233747}
.home{display:inline-flex;align-items:center;gap:7px;color:#8be4c3;text-decoration:none;font-weight:700;padding:8px 12px;border:1px solid #285247;border-radius:12px;background:#102a29}
h1{font-size:16px;margin:0;font-weight:700}.hint{font-size:12px;color:#a6b7c4;margin-right:auto}
main{height:calc(100dvh - 54px);width:100%}iframe{display:block;width:100%;height:100%;border:0;background:#071019}
.fallback{position:absolute;inset:54px 0 0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:#071019;line-height:1.9}.fallback a{color:#8be4c3}
</style>
</head>
<body>
<header><a class="home" href="/" id="homeBtn" aria-label="العودة إلى الصفحة الرئيسية">⌂ <span>الرئيسية</span></a><h1>فاحص الإفصاحات</h1><span class="hint">SAS PRO</span></header>
<main><iframe id="scanFrame" src="https://scanstock.grok.me/" title="فاحص الإفصاحات من ScanStock" referrerpolicy="strict-origin-when-cross-origin" allow="clipboard-read; clipboard-write"></iframe></main>
<div class="fallback" id="fallback"><div><h2>تعذر عرض الموقع داخل التطبيق</h2><p>قد يمنع الموقع الخارجي عرضه داخل نافذة SAS PRO.</p><a href="https://scanstock.grok.me/" target="_blank" rel="noopener">افتح ScanStock مباشرة</a></div></div>
<script>
(function(){
 const tg=window.Telegram&&window.Telegram.WebApp;
 const goHome=()=>{if(tg){try{tg.BackButton.hide();}catch(e){} }window.location.href='/';};
 document.getElementById('homeBtn').addEventListener('click',e=>{e.preventDefault();goHome();});
 if(tg){try{tg.ready();tg.expand();tg.BackButton.show();tg.BackButton.onClick(goHome);}catch(e){}}
 // Keep the in-app home control available even if the external site cannot be embedded.
 const frame=document.getElementById('scanFrame');
 frame.addEventListener('error',()=>{document.getElementById('fallback').style.display='flex';});
})();
</script>
</body>
</html>
