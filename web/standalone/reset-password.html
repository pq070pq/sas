<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020912">
<meta name="robots" content="noindex,nofollow">
<title>استعادة كلمة المرور | SAS PRO</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#020912;color:#eaf2ff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#102d4b 0,transparent 55%),#020912}
main{width:min(100%,440px);padding:28px;border:1px solid #214464;border-radius:22px;background:#071421;box-shadow:0 18px 60px #0008}
.logo{text-align:center;font-weight:900;letter-spacing:.12em;color:#62d5ff;font-size:1.4rem}h1{text-align:center;font-size:1.35rem;margin:18px 0 10px}p{color:#aebfd3;line-height:1.8}label{display:block;margin:16px 0 7px}input{width:100%;padding:13px;border:1px solid #31516b;border-radius:10px;background:#030d17;color:#fff;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:12px;background:#00a9d6;color:#00131d;font-weight:800;font-size:1rem;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#message{min-height:3em;margin-top:18px}
</style>
</head>
<body><main>
<div class="logo">SAS PRO</div>
<h1>تعيين كلمة مرور جديدة</h1>
<p>اختر كلمة مرور جديدة لا تقل عن 12 حرفًا. بعد التغيير سيتم إنهاء الجلسات الحالية.</p>
<form id="resetForm">
<label for="password">كلمة المرور الجديدة</label>
<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
<label for="confirm">تأكيد كلمة المرور</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024" required>
<button id="submit" type="submit">حفظ كلمة المرور</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
</main>
<script>
(() => {
  const form = document.getElementById("resetForm");
  const password = document.getElementById("password");
  const confirm = document.getElementById("confirm");
  const submit = document.getElementById("submit");
  const message = document.getElementById("message");
  const token = new URLSearchParams(window.location.search).get("token") || "";
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!token || token.length < 20 || token.length > 512) {
      message.textContent = "رابط الاستعادة غير صالح أو منتهي الصلاحية.";
      return;
    }
    if (password.value.length < 12) {
      message.textContent = "يجب أن تتكون كلمة المرور من 12 حرفًا على الأقل.";
      return;
    }
    if (password.value !== confirm.value) {
      message.textContent = "كلمتا المرور غير متطابقتين.";
      return;
    }
    submit.disabled = true;
    message.textContent = "جارٍ تحديث كلمة المرور…";
    try {
      const response = await fetch("/api/standalone/auth/reset-password", {
        method: "POST", headers: {"Content-Type":"application/json"},
        credentials: "same-origin",
        body: JSON.stringify({token, new_password: password.value})
      });
      if (!response.ok) throw new Error("reset_failed");
      form.hidden = true;
      message.textContent = "تم تحديث كلمة المرور وإنهاء الجلسات السابقة. يمكنك تسجيل الدخول بكلمة المرور الجديدة.";
    } catch (_) {
      message.textContent = "تعذر تحديث كلمة المرور. تحقق من الرابط وحاول مرة أخرى.";
      submit.disabled = false;
    }
  });
  if (!token || token.length < 20 || token.length > 512) {
    message.textContent = "رابط الاستعادة غير صالح أو منتهي الصلاحية.";
    submit.disabled = true;
  }
})();
</script>
</body></html>
