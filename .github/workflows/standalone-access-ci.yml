name: Standalone Access CI

on:
  push:
    branches: [feature/sas-mobile-app]
    paths:
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/standalone-access-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test*.py" -v
