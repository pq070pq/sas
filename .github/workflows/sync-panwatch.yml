name: Sync PanWatch

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync PanWatch
        run: |
          set -euo pipefail
          rm -rf vendor/PanWatch
          mkdir -p vendor
          git clone --depth 1 https://github.com/TNT-Likely/PanWatch.git vendor/PanWatch
          rm -rf vendor/PanWatch/.git
      - name: Commit
        run: |
          git config user.name "SAS PRO Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/PanWatch
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: sync PanWatch upstream"
          git push
