name: SAS PRO syntax check
on:
  workflow_dispatch:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q app
      - run: pip install -r requirements.txt
      - run: python -c "import app.main; print('SAS PRO import OK')"
