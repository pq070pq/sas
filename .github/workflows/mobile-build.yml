name: SAS PRO Mobile Build

on:
  workflow_dispatch:
  push:
    branches: [feature/sas-mobile-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'

permissions:
  contents: read

env:
  SAS_API_BASE: ${{ vars.SAS_API_BASE }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate public app configuration
        run: |
          test -n "$SAS_API_BASE" || (echo 'Set SAS_API_BASE to an isolated staging API origin before building; production is intentionally blocked.' && exit 1)
          if [ "$SAS_API_BASE" = "https://vps-b67ef07b.vps.ovh.ca" ]; then
            echo 'Refusing to build a standalone app pointed at the production SAS host.'
            exit 1
          fi
      - name: Install and build web shell
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build Android APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sas-pro-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-project:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate public app configuration
        run: |
          test -n "$SAS_API_BASE" || (echo 'Missing repository variable SAS_API_BASE' && exit 1)
      - name: Generate iOS project
        working-directory: mobile
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add ios
          npx cap sync ios
      - uses: actions/upload-artifact@v4
        with:
          name: sas-pro-ios-xcode-project
          path: mobile/ios/App
          if-no-files-found: error
          retention-days: 14
