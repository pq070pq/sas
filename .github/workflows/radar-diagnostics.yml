name: SAS PRO Radar Diagnostics

on:
  workflow_dispatch:

concurrency:
  group: saspro-radar-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare OVH SSH key
        shell: bash
        env:
          OVH_SSH_KEY_B64: ${{ secrets.OVH_SSH_KEY_B64 }}
        run: |
          set -e
          key_file="$RUNNER_TEMP/ovh_key"
          printf '%s' "$OVH_SSH_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "SSH key decoded successfully."

      - name: Run live radar diagnostics on OVH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/saspro

            echo "===== SAS PRO RADAR DIAGNOSTICS ====="
            docker compose ps saspro

            docker compose exec -T saspro python - <<'PY'
            import asyncio
            import json
            from app.scanner import scan_us_low_price_stocks

            async def main():
                result = await scan_us_low_price_stocks()
                d = result.get("diagnostics") or {}
                compact = {
                    "candidates": d.get("candidates"),
                    "shortlist": d.get("shortlist"),
                    "passed": d.get("passed"),
                    "filtered": d.get("filtered"),
                    "errors": d.get("errors"),
                    "passed_examples": d.get("passed_examples"),
                    "error_examples": d.get("error_examples"),
                    "filtered_examples": d.get("filtered_examples"),
                    "filter_counts": d.get("filter_counts"),
                    "twelve_data_quota_exhausted": d.get("twelve_data_quota_exhausted"),
                    "rules": d.get("momentum_rules"),
                }
                print(json.dumps(compact, ensure_ascii=False, indent=2, default=str))

            asyncio.run(main())
            PY

            echo "===== END SAS PRO RADAR DIAGNOSTICS ====="
