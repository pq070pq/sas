name: Read-only OVH staging preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saspro-ovh-readonly-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect OVH host (read-only)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Prepare OVH SSH key
        shell: bash
        env:
          OVH_SSH_KEY_B64: ${{ secrets.OVH_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${OVH_SSH_KEY_B64:-}" ]; then
            echo "::error::OVH_SSH_KEY_B64 is not configured."
            exit 1
          fi
          key_file="$RUNNER_TEMP/ovh_readonly_key"
          printf '%s' "$OVH_SSH_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "SSH key validated."

      - name: Read-only host inventory
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_readonly_key
          port: ${{ secrets.OVH_PORT || '22' }}
          command_timeout: 5m
          script: |
            set +e

            section() { printf '\n===== %s =====\n' "$1"; }

            section "IDENTITY AND OS"
            id
            hostname
            date -u
            uname -a
            ( . /etc/os-release 2>/dev/null; printf 'OS=%s\nVERSION=%s\n' "$PRETTY_NAME" "$VERSION_ID" )

            section "CPU AND MEMORY"
            nproc
            uptime
            free -h
            (command -v lscpu >/dev/null 2>&1 && lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Thread|Core|Socket)' | head -n 12)

            section "DISK AND MOUNTS"
            df -hT
            lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINT 2>/dev/null | head -n 40

            section "DOCKER VERSIONS AND HEALTH"
            if command -v docker >/dev/null 2>&1; then
              docker --version
              docker compose version
              docker info --format 'ServerVersion={{.ServerVersion}} StorageDriver={{.Driver}} CgroupVersion={{.CgroupVersion}}' 2>&1
            else
              echo "Docker is not installed or not on PATH."
            fi

            section "CONTAINERS (NAMES, STATUS, PORTS ONLY)"
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' 2>&1

            section "DOCKER COMPOSE PROJECTS"
            docker compose ls --all 2>&1

            section "DOCKER VOLUMES AND NETWORKS"
            docker volume ls 2>&1
            docker network ls 2>&1

            section "LISTENING TCP PORTS"
            if command -v ss >/dev/null 2>&1; then ss -lnt 2>&1; else netstat -lnt 2>&1; fi

            section "SERVICE STATES (NO RESTARTS)"
            for service in docker nginx; do
              if command -v systemctl >/dev/null 2>&1; then
                printf '%s=' "$service"
                systemctl is-active "$service" 2>&1
              fi
            done
            if command -v nginx >/dev/null 2>&1; then nginx -v 2>&1; fi

            section "END OF READ-ONLY INVENTORY"
            echo "No files, services, containers, volumes, networks, firewall rules, DNS, or application data were changed."
