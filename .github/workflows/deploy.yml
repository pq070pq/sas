name: Deploy SAS PRO to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: saspro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to OVH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER }}
          key: ${{ secrets.OVH_SSH_KEY }}
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro
            git fetch origin main
            git reset --hard origin/main
            docker compose build saspro
            docker compose up -d saspro
            docker compose ps saspro
