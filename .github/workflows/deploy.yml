name: Deploy SAS PRO to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: saspro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare OVH SSH key
        shell: bash
        env:
          OVH_SSH_KEY_B64: ${{ secrets.OVH_SSH_KEY_B64 }}
        run: |
          set -e
          key_file="$RUNNER_TEMP/ovh_key"
          printf '%s' "$OVH_SSH_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "SSH key decoded successfully."

      - name: Deploy to OVH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro
            git fetch origin main
            git reset --hard origin/main
            docker compose build saspro panwatch
            docker rm -f saspro-saspro-1 2>/dev/null || true
            docker rm -f saspro-panwatch-1 2>/dev/null || true
            docker compose up -d --no-deps saspro panwatch
            docker compose ps saspro panwatch

      - name: Smoke test SAS PRO container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro

            # Deployment validation must not depend on external market-data
            # providers. Those providers can timeout or be temporarily
            # unavailable without meaning the application deployment failed.
            docker compose ps saspro

            docker compose exec -T saspro python -c "from app.main import app; print('SAS_PRO_VERSION=', app.version)"
            # Give the Telegram polling task enough time to perform at least one
            # getUpdates call so deployment logs capture the receiver state.
            sleep 8
            echo "===== SAS PRO recent logs ====="
            docker compose logs --tail=120 saspro || true
            echo "===== END SAS PRO recent logs ====="

            echo "✅ OVH deployment smoke test passed."
