name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: saspro-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy to OVH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          host: vps-b67ef07b.vps.ovh.ca
          username: root
          key: ${{ secrets.OVH_SSH_KEY }}
          port: 22
          envs: GROQ_API_KEY
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/saspro

            echo "==> Syncing repository with origin/main"
            git fetch --prune origin main
            git reset --hard origin/main

            # Production secrets stay outside Git. GROQ_API_KEY is optionally
            # synchronized from a GitHub Actions repository secret.
            if [ -n "${GROQ_API_KEY:-}" ]; then
              touch .env
              tmp_env=".env.deploy.tmp"
              grep -v '^GROQ_API_KEY=' .env > "$tmp_env" || true
              printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> "$tmp_env"
              chmod 600 "$tmp_env"
              mv "$tmp_env" .env
            fi

            echo "==> Disabling legacy systemd service if present"
            if systemctl is-active --quiet saspro.service; then
              systemctl stop saspro.service || true
            fi
            systemctl disable saspro.service 2>/dev/null || true

            echo "==> Building and starting Docker stack"
            docker compose pull || true
            docker compose up -d --build --remove-orphans

            echo "==> Cleaning unused Docker images"
            docker image prune -f

            echo "==> Waiting for application health"
            healthy=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/tmp/saspro-health.json 2>/dev/null; then
                healthy=1
                break
              fi
              sleep 2
            done

            if [ "$healthy" -ne 1 ]; then
              echo "Health check failed"
              docker compose ps
              docker compose logs --tail=120 saspro
              exit 1
            fi

            echo "==> Production status"
            git rev-parse --short HEAD
            docker compose ps
            cat /tmp/saspro-health.json
