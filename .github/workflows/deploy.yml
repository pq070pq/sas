name: Deploy SAS PRO to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: saspro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare OVH SSH key
        shell: bash
        env:
          OVH_SSH_KEY_B64: ${{ secrets.OVH_SSH_KEY_B64 }}
        run: |
          set -e
          key_file="$RUNNER_TEMP/ovh_key"
          printf '%s' "$OVH_SSH_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "SSH key decoded successfully."

      - name: Deploy to OVH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro
            git fetch origin main
            git reset --hard origin/main
            docker compose build saspro
            docker rm -f saspro-saspro-1 2>/dev/null || true
            docker compose up -d --no-deps saspro
            docker compose ps saspro

      - name: Smoke test Holiday Radar data
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro
            docker compose exec -T saspro python - <<'PY'
            import asyncio
            from app.holiday_radar import holiday_snapshot

            async def main():
                rows = await holiday_snapshot()
                print("🌙 HOLIDAY RADAR TEST")

                valid = 0
                for label, item in rows:
                    price = item.get("price")
                    source = item.get("source") or "—"
                    print(f"{label} => {price if price is not None else '—'} | {source}")
                    try:
                        if price is not None and float(price) > 0:
                            valid += 1
                    except (TypeError, ValueError):
                        pass

                print(f"VALID REAL ASSETS: {valid}/{len(rows)}")

                # External market-data providers can temporarily time out or
                # return no data. That must NOT block deployment.
                # holiday_snapshot() already prevents publishing a report when
                # no real prices are available.
                if valid == 0:
                    print("⚠️ No real market prices available right now.")
                    print("⚠️ Deployment continues; Holiday Radar will remain silent until real data is available.")
                else:
                    print("✅ Real market data is available.")
                    print("✅ Holiday Radar can publish only validated real prices.")

            asyncio.run(main())
            PY
