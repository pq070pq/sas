name: Deploy SAS PRO to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: saspro-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare OVH SSH key
        shell: bash
        env:
          OVH_SSH_KEY_B64: ${{ secrets.OVH_SSH_KEY_B64 }}
        run: |
          set -e
          key_file="$RUNNER_TEMP/ovh_key"
          printf '%s' "$OVH_SSH_KEY_B64" | base64 --decode > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "SSH key decoded successfully."

      - name: Deploy to OVH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro
            git fetch origin main
            git reset --hard origin/main
            docker compose build saspro
            docker rm -f saspro-saspro-1 2>/dev/null || true
            docker compose up -d --no-deps saspro
            docker compose ps saspro

      - name: Smoke test SAS PRO container
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.OVH_HOST }}
          username: ${{ secrets.OVH_USER || 'root' }}
          key_path: ${{ runner.temp }}/ovh_key
          port: ${{ secrets.OVH_PORT || '22' }}
          script: |
            set -e
            cd /opt/saspro

            # Deployment validation must not depend on external market-data
            # providers. Those providers can timeout or be temporarily
            # unavailable without meaning the application deployment failed.
            docker compose ps saspro

            test "$(docker inspect -f '{{.State.Running}}' saspro-saspro-1 2>/dev/null || true)" = "true"

            docker compose exec -T saspro python - <<'PY'
            from app.main import app
            from app.config import settings
            print(f"✅ SAS PRO application imported successfully: version={app.version}")
            print(f"Telegram token configured: {bool(settings.telegram_bot_token)}")
            print(f"Telegram webhook auto-configure: {settings.telegram_webhook_auto_configure}")
            print(f"Telegram webhook secret configured: {bool(settings.telegram_webhook_secret)}")
            print(f"App base URL configured: {bool(settings.app_base_url)}")
            PY

            echo "===== SAS PRO recent logs ====="
            docker compose logs --tail=250 saspro || true
            echo "===== END SAS PRO recent logs ====="

            # Exercise the public webhook endpoint through HTTPS from inside the deployed container.
            # This reproduces Telegram's POST path without exposing credentials.
            docker compose exec -T saspro python - <<'PY'
            import asyncio
            import httpx
            from app.config import settings

            async def main():
                url = settings.app_base_url.rstrip("/") + "/api/telegram/webhook"
                headers = {"Content-Type": "application/json"}
                if settings.telegram_webhook_secret:
                    headers["X-Telegram-Bot-Api-Secret-Token"] = settings.telegram_webhook_secret
                payload = {
                    "update_id": 999999992,
                    "message": {
                        "message_id": 1,
                        "from": {"id": 0},
                        "chat": {"id": 0, "type": "private"},
                        "text": "",
                    },
                }
                async with httpx.AsyncClient(timeout=20, verify=False) as client:
                    response = await client.post(url, headers=headers, json=payload)
                print("Public Telegram webhook HTTP status:", response.status_code)
                print("Public Telegram webhook body:", response.text[:500])
                if response.status_code != 200:
                    raise SystemExit("❌ Public Telegram webhook is not returning HTTP 200.")

            asyncio.run(main())
            PY

            # Verify Telegram webhook configuration without exposing the bot token.
            docker compose exec -T saspro python - <<'PY
            import asyncio
            from app.telegram import bot_api
            async def main():
                info = await bot_api("getWebhookInfo", {})
                print("Telegram webhook URL configured:", bool(info.get("url")))
                print("Telegram webhook pending updates:", info.get("pending_update_count", "?"))
                print("Telegram webhook last error:", info.get("last_error_message") or "none")
                print("Telegram webhook last error date:", info.get("last_error_date") or "none")
                if not info.get("url"):
                    raise SystemExit("❌ Telegram webhook is not configured.")
                # last_error_message can describe an earlier failed delivery;
                # the deployment itself is valid as long as a webhook URL is configured.
                if info.get("last_error_message"):
                    print("⚠️ Telegram webhook has a previous delivery error; new deliveries will be checked by the next bot update.")
            asyncio.run(main())
            PY

            echo "✅ OVH deployment smoke test passed."
