services:
  saspro:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - RADAR_INTERVAL_MINUTES=30
      - TWELVE_DATA_API_KEY=${TWELVE_DATA_API_KEY:-}
      - TWELVE_DATA_API_KEYS=${TWELVE_DATA_API_KEYS:-}
      - ZOYA_API_KEY=${ZOYA_API_KEY:-}
      - MARKETAUX_API_KEY=${MARKETAUX_API_KEY:-}
      - TWELVE_DATA_SCAN_FALLBACK_SYMBOLS=3
      - TWELVE_DATA_INTRADAY_SYMBOLS=2
      - TWELVE_DATA_DAILY_REQUEST_CAP=30
      - TWELVE_DATA_RESERVE_CREDITS=100
      - MARKET_UPDATE_INTERVAL_MINUTES=30
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - saspro_data:/app/data
    depends_on:
      - panwatch
      - openterminal-web

  panwatch:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./vendor/PanWatch
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - panwatch_data:/app/data

  openterminal-api:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/openterminal-api.Dockerfile
    restart: unless-stopped
    environment:
      - API_HOST=0.0.0.0
      - API_KEY=${OPENTERMINAL_API_KEY:-}
      - WEB_ORIGIN=${OPENTERMINAL_BASE_URL:-}
      - API_PORT=4000
    expose:
      - "4000"

  openterminal-web:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: docker/openterminal-web.Dockerfile
      args:
        NEXT_BASE_PATH: ${OPENTERMINAL_BASE_PATH:-/terminal}
    restart: unless-stopped
    environment:
      - API_URL=http://openterminal-api:4000
      - API_KEY=${OPENTERMINAL_API_KEY:-}
      - API_KEY_FILE=/app/data/.api-key
      - SAS_TERMINAL_SECRET=${SAS_TERMINAL_SECRET:-}
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - openterminal_data:/app/data:ro
    depends_on:
      - openterminal-api

volumes:
  saspro_data:
  panwatch_data:
  openterminal_data:
